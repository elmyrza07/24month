{% extends 'posts/base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div style="padding: 10px 0;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h1 style="font-size: 24px;">{{ post.title }}</h1>
        {% if post.rate is not None %}
            <span class="rate-badge" style="font-size: 14px; padding: 4px 10px;">★ Рейтинг: {{ post.rate }}</span>
        {% endif %}
    </div>

    <div style="background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 20px; line-height: 1.6;">
        <p style="font-size: 16px; color: #374151;">{{ post.description }}</p>
    </div>

    <a href="{% url 'post_list' %}" class="btn btn-secondary">← Назад к списку</a>
</div>
{% endblock %}
